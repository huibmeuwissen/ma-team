name: Meldingen versturen

# Meldingen gaan nu via de Cloud Function "meldingen" in Firebase (elke minuut, zie functions/index.js).
# Deze workflow is alleen nog een reserve om met de hand te starten via het tabblad Actions.
on:
  workflow_dispatch:

concurrency:
  group: meldingen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verstuur:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Firebase Admin installeren
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - name: Meldingen versturen
        run: node .github/scripts/meldingen.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
