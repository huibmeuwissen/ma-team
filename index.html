<style>
/* Indeling: groene kopbalk met tabbladen (zelfde stijl als het lokale MA Dashboard); daaronder één kolom kaarten. Opvolg-pop-up als modaal venster; klantkaart als zijpaneel. */
:root {
  --page: #f4f5f1; --surface: #ffffff; --surface-2: #f1f3ee; --surface-3: #e3e7de;
  --ink: #16201a; --ink-2: #4c574f; --muted: #7a847c;
  --grid: #e6e8e1; --border: rgba(22,32,26,.1);
  --brand: #1f6b3a; --brand-dark: #154a29; --brand-ink: #ffffff; --brand-soft: #e7f2ea; --brand-line: #b9d8c3;
  --top-bg: #163f26; --top-ink: #eaf3ec; --top-muted: #a9c4b1; --top-line: #7fd09e;
  --bar: #2f8a52;
  --due-bg: #fff6df; --due-border: #efcb72; --due-ink: #7a5300;
  --good-bg: #e6f4ea; --good-ink: #1d6b35; --crit: #c23434; --crit-bg: #fbeaea;
  --info-bg: #e8f0fb; --info-ink: #24508f;
  --shadow: 0 1px 2px rgba(22,32,26,.05), 0 4px 14px rgba(22,32,26,.05);
  --scrim: rgba(10,20,14,.45);
  --radius: 12px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1411; --surface: #19201b; --surface-2: #212a24; --surface-3: #2c372f;
    --ink: #eef2ee; --ink-2: #bcc6be; --muted: #8a958c;
    --grid: #29322b; --border: rgba(255,255,255,.1);
    --brand: #56b87b; --brand-dark: #7fd09e; --brand-ink: #08130c; --brand-soft: #1c2c22; --brand-line: #2f5a3f;
    --top-bg: #0c1f14; --top-ink: #eaf3ec; --top-muted: #8fb09a; --top-line: #7fd09e;
    --bar: #4fae73;
    --due-bg: #2f2710; --due-border: #6d5620; --due-ink: #f3d58a;
    --good-bg: #16301f; --good-ink: #7fd39a; --crit: #f08080; --crit-bg: #3a1c1c;
    --info-bg: #182638; --info-ink: #9cc0f0;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f1411; --surface: #19201b; --surface-2: #212a24; --surface-3: #2c372f;
  --ink: #eef2ee; --ink-2: #bcc6be; --muted: #8a958c;
  --grid: #29322b; --border: rgba(255,255,255,.1);
  --brand: #56b87b; --brand-dark: #7fd09e; --brand-ink: #08130c; --brand-soft: #1c2c22; --brand-line: #2f5a3f;
  --top-bg: #0c1f14; --top-ink: #eaf3ec; --top-muted: #8fb09a; --top-line: #7fd09e;
  --bar: #4fae73;
  --due-bg: #2f2710; --due-border: #6d5620; --due-ink: #f3d58a;
  --good-bg: #16301f; --good-ink: #7fd39a; --crit: #f08080; --crit-bg: #3a1c1c;
  --info-bg: #182638; --info-ink: #9cc0f0;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--top-bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 650; margin: 0; }
h3 { font-size: .92rem; font-weight: 650; margin: 0; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* kopbalk */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--top-bg); color: var(--top-ink); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.top .in { display: flex; align-items: stretch; flex-wrap: wrap; gap: 0 20px; max-width: 1400px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brandname { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 1.02rem; min-height: 54px; white-space: nowrap; }
.brandname .ma { font-size: 1.45rem; font-weight: 800; font-style: italic; letter-spacing: -.04em; color: #8fdcab; line-height: 1; }
.brandname span.t { font-weight: 400; color: var(--top-muted); font-size: .78rem; padding: 2px 8px; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav a { display: flex; align-items: center; gap: 6px; padding: 0 12px; min-height: 54px; text-decoration: none; color: var(--top-muted);
  border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
nav a:hover { color: #fff; background: rgba(255,255,255,.06); }
nav a.on { color: #fff; font-weight: 600; border-bottom-color: var(--top-line); }
nav a:focus-visible { outline-color: var(--top-line); outline-offset: -3px; }
.npill { display: inline-block; min-width: 19px; padding: 0 6px; border-radius: 10px; background: #e5484d; color: #fff; font-size: .74rem; font-weight: 700; text-align: center; line-height: 1.5; }
.me { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--top-muted); font-size: .85rem; padding-block: 8px; }
.me b { color: var(--top-ink); font-weight: 650; }
.me button { background: transparent; border: 1px solid rgba(255,255,255,.25); color: var(--top-ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.me button:hover { background: rgba(255,255,255,.08); }

main { max-width: 1400px; margin: 0 auto; padding-block: 24px 70px; display: flex; flex-direction: column; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { display: flex; flex-direction: column; gap: 4px; }
.head p { color: var(--ink-2); max-width: 85ch; }
.banner { border-radius: 10px; padding: 10px 14px; border: 1px solid var(--due-border); background: var(--due-bg); color: var(--due-ink); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.card.due { background: var(--due-bg); border-color: var(--due-border); }
.cardhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
a.tile:hover { border-color: var(--brand-line); }
.tile .l { color: var(--ink-2); font-size: .76rem; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
.tile .v { font-size: 1.7rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .n { color: var(--muted); font-size: .82rem; }
.tile.hot { background: var(--due-bg); border-color: var(--due-border); }
.tile.hot .v { color: var(--due-ink); }

/* knoppen, chips, velden */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--surface-3); background: var(--surface); border-radius: 8px; padding: 7px 13px; cursor: pointer; white-space: nowrap; text-decoration: none; color: inherit; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 650; }
.btn.pri:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
.btn.sm { padding: 3px 9px; font-size: .84rem; }
.btn.danger { color: var(--crit); }
.btn.danger.sure { background: var(--crit-bg); border-color: var(--crit); font-weight: 650; }
.btn:disabled { opacity: .5; cursor: default; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--surface-3); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip:hover { border-color: var(--brand-line); }
.chip.on, .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; position: relative; }
.field > label, .field > .lbl { font-size: .76rem; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
input[type="text"], input[type="search"], input[type="date"], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--surface-3); border-radius: 8px; padding: 8px 10px; }
textarea { resize: vertical; min-height: 70px; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: 2px solid var(--brand-soft); outline-offset: 0; }
.search { max-width: 380px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { position: relative; display: inline-flex; align-items: center; padding: 6px 12px; border: 1px solid var(--surface-3); border-radius: 999px; background: var(--surface); cursor: pointer; user-select: none; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:hover { border-color: var(--brand-line); }
.opt:has(input:checked) { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.opt:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--brand-line); border-radius: 10px; background: var(--brand-soft); cursor: pointer; font-weight: 600; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }
.err { color: var(--crit); font-size: .88rem; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.formgrid .wide { grid-column: 1 / -1; }
@media (max-width: 640px) { .formgrid { grid-template-columns: minmax(0, 1fr); } }

/* tabellen en lijsten */
.tw { overflow-x: auto; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th { text-align: left; font-size: .74rem; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); padding: 6px 8px; border-bottom: 1px solid var(--surface-3); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.wrap { min-width: 220px; max-width: 460px; overflow-wrap: anywhere; }
.klantlink { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; text-align: left; font-weight: 600; text-decoration: underline; text-decoration-color: var(--brand-line); text-underline-offset: 2px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .77rem; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.due { background: var(--due-bg); color: var(--due-ink); box-shadow: inset 0 0 0 1px var(--due-border); }
.pill.plan { background: var(--info-bg); color: var(--info-ink); }
.pill.klaar { background: var(--good-bg); color: var(--good-ink); }
.pill.grey { background: var(--surface-2); color: var(--ink-2); }
.pill.p1 { background: var(--crit-bg); color: var(--crit); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list > li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--grid); min-width: 0; }
.list > li:first-child { border-top: 0; padding-top: 0; }
.list .body { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; }
.list .meta { color: var(--muted); font-size: .83rem; }
.list .acts { flex: none; display: flex; gap: 6px; align-items: center; }
/* smal scherm: tekst krijgt de volle breedte, knoppen gaan eronder (anders wordt de tekst één letter breed) */
.list > li { flex-wrap: wrap; }
.list .body { flex-basis: 160px; }
@media (max-width: 640px) { th.rol, td.rol { display: none; } }
@media (max-width: 640px) { .list > li { gap: 6px 12px; } .list .body { flex-basis: 100%; } .list .acts { width: 100%; justify-content: flex-end; } }
.empty { color: var(--muted); }
.tekst { white-space: pre-wrap; color: var(--ink-2); }

/* grafiek */
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .lbl-v { fill: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }

/* modaal en zijpaneel */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog { background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); width: min(620px, 100%); max-height: 100%; overflow: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.dialog .kop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dialog .eyebrow { font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--due-ink); }
.dialog .foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.dialog .foot .left { margin-right: auto; }
.taakbox { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.x { border: 0; background: none; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.drawer-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 45; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--page); z-index: 46; overflow: auto; box-shadow: -10px 0 40px rgba(0,0,0,.2);
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) 18px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; user-select: text; }
.why { border-left: 3px solid var(--due-border); padding: 4px 0 4px 10px; }
.ac { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; background: var(--surface); border: 1px solid var(--surface-3); border-radius: 8px; box-shadow: var(--shadow); margin-top: 4px; list-style: none; padding: 4px; max-height: 280px; overflow: auto; }
.ac li { padding: 7px 9px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.ac li small { color: var(--muted); white-space: nowrap; }
.ac li.on, .ac li:hover { background: var(--brand-soft); }
.gekozen { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--brand-line); background: var(--brand-soft); border-radius: 8px; }
.gekozen span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.login { max-width: 560px; margin: 40px auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .dialog.pop { animation: pop .25s ease-out; } }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
</style>

  function dbFout(e) {
    clearTimeout(laadTimer); alleenLezen = true;
    laadNoot = e && e.code === "revoked" ? "Je hebt geen toegang meer tot de gedeelde gegevens." : "De verbinding met de gedeelde gegevens is verbroken. Open de pagina opnieuw.";
    render();
  }
  /* ================= gedeelde opslag via Firebase + teamcode ================= */
  function normCode(c) { return String(c || "").toLowerCase().replace(/[^a-z0-9-]/g, ""); }
  function startFirebase() {
    fbModus = true; clearTimeout(laadTimer);
    firebase.initializeApp(FB_CONFIG);
    fbKlaar = firebase.auth().signInAnonymously();
    try { var n = localStorage.getItem(LS_NAAM); if (n) ik = n; } catch (e) {}
    var c = null; try { c = localStorage.getItem(LS_CODE); } catch (e) {}
    if (c) verbindTeam(c, false); else render();
  }
  function teamDb(code) {
    var fdb = firebase.firestore(), base = "teams/" + code + "/";
    return { collection: function (c) { return fdb.collection(base + c); }, doc: function (p) { return fdb.doc(base + p); } };
  }
  var subs = [];
  function verbindTeam(code, nieuw) {
    return fbKlaar.then(function () {
      var tdb = teamDb(code);
      var info = tdb.doc("info/team");
      return info.get().then(function (s) {
        if (s.exists) return true;
        if (!nieuw) return false;
        return info.set({ gemaakt: Date.now() }).then(function () { return true; });
      }).then(function (ok) {
        if (!ok) return false;
        teamCode = code; viewTeamcode.waarde = ""; try { localStorage.setItem(LS_CODE, code); } catch (e) {}
        subs.forEach(function (u) { try { u(); } catch (e) {} });
        taken = []; contacten = []; loadedT = loadedC = false; alleenLezen = false; laadNoot = "";
        store = dbStore(tdb);
        subs = [store.sub("taken", onTaken, dbFout), store.sub("contacten", onContacten, dbFout)];
        render(); checkPopup();
        if (ik && "Notification" in window && Notification.permission === "granted") bewaarToken(true);
        return true;
      });
    });
  }
  function teamUit() {
    subs.forEach(function (u) { try { u(); } catch (e) {} }); subs = [];
    teamCode = null; store = null; taken = []; contacten = []; loadedT = loadedC = false;
    try { localStorage.removeItem(LS_CODE); } catch (e) {}
    render();
  }
  function viewTeamcode(main) {
    var inp = el("input", { type: "password", id: "tc-code", autocomplete: "off", placeholder: "Teamcode", "data-focus": true, value: viewTeamcode.waarde || "",
      oninput: function () { viewTeamcode.waarde = this.value; } });
    var err = el("p", { class: "err", hidden: true });
    var btn = el("button", { type: "button", class: "btn pri", text: "Verder" });
    var nieuwBox = el("div", { hidden: true }, [
      el("p", { text: "Er is nog geen team met deze code. Klopt de code? Dan start je hiermee een nieuw team; de anderen gebruiken daarna dezelfde code." }),
      el("div", { class: "bar" }, [el("button", { type: "button", class: "btn pri", text: "Nieuw team starten", onclick: function () { probeer(true); } }),
        el("button", { type: "button", class: "btn", text: "Code opnieuw invullen", onclick: function () { nieuwBox.hidden = true; inp.value = ""; inp.focus(); } })])
    ]);
    function probeer(nieuw) {
      err.hidden = true;
      var c = normCode(inp.value);
      if (c.length < 6) { err.textContent = "De teamcode heeft minstens 6 letters of cijfers."; err.hidden = false; return; }
      btn.disabled = true;
      verbindTeam(c, nieuw).then(function (ok) { btn.disabled = false; if (!ok) nieuwBox.hidden = false; },
        function () { btn.disabled = false; err.textContent = "Geen verbinding. Controleer je internet en probeer het opnieuw."; err.hidden = false; });
    }
    btn.addEventListener("click", function () { probeer(false); });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") probeer(false); });
    main.appendChild(el("div", { class: "card login" }, [
      el("h1", { text: "Teamcode" }),
      el("p", { class: "muted", text: "Vul de teamcode in die je van Huib of Renate hebt gekregen. Je hoeft dit maar één keer te doen op dit apparaat." }),
      el("div", { class: "field" }, [el("label", { for: "tc-code", text: "Teamcode" }), inp]),
      err, el("div", { class: "bar" }, [btn]), nieuwBox
    ]));
  }

  (async function () {
    if (!(window.claude && window.claude.use)) {
      if (window.firebase && firebase.initializeApp) { try { startFirebase(); return; } catch (e) {} }
      startLokaal(); dataStatus = "geen"; render(); return;
    }
    var db = null;
    try { db = await window.claude.use("db"); } catch (e) {}
    if (!db) { startLokaal(); dataStatus = "geen"; render(); return; }
    store = dbStore(db);
    try { assetsNs = await window.claude.use("assets"); } catch (e) { assetsNs = null; }
    db.doc("config/data").onSnapshot(function (s) { laadData(s.exists ? s.data() : null); }, function () { if (!D) { dataStatus = "fout"; render(); } });
    try { userNs = await window.claude.use("user"); } catch (e) { userNs = null; }
    if (userNs) {
      try { if ((await userNs.can("data.write")) === false) alleenLezen = true; } catch (e) {}
      try { uid = await userNs.id(); } catch (e) {}
    }
    store.sub("taken", onTaken, dbFout);
    store.sub("contacten", onContacten, dbFout);
    db.doc("config/team").onSnapshot(function (s) {
      var d = s.exists ? s.data() : null;
      if (d && Array.isArray(d.leden) && d.leden.length) { team = d.leden.filter(function (p) { return p && p.naam; }).map(function (p) { return { naam: String(p.naam), rol: String(p.rol || "") }; }); render(); }
    }, function () {});
    // wie ben ik: eerst eigen profiel, dan deze browser, dan de naam van het Claude-account
    var naam = null;
    if (uid) { try { var p = await store.getDoc("data/users/" + uid + "/profiel"); if (p && p.naam) naam = p.naam; } catch (e) {} }
    if (!naam) { try { naam = localStorage.getItem(LS_NAAM); } catch (e) {} }
    if (!naam && userNs) {
      try {
        var acc = ((await userNs.name()) || "").toLowerCase().replace(/[^a-z\- ]/g, "");
        var hit = team.filter(function (t) { var v = t.naam.toLowerCase(); return acc.split(" ")[0] === v || acc.split(" ")[0] === v.replace("-", ""); })[0];
        if (hit) naam = hit.naam;
      } catch (e) {}
    }
    if (naam && !ik) { ik = naam; if (uid) store.setDoc("data/users/" + uid + "/profiel", { naam: naam }).catch(function () {}); }
    render(); checkPopup();
  })();
})();
</script>

</body>
